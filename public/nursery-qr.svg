    <path d="M226 210 L238 210 C244 210 248 214 248 220 C248 226 244 230 238 230 L226 230 Z M226 210 L226 250 M226 220 L240 220" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
